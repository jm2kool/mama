<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🎂 Kamna's Cake Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f9a8c9;
    --pink-deep: #e8709a;
    --lilac: #c4a8e8;
    --lilac-light: #e8daf9;
    --cream: #fdf6ee;
    --cream-dark: #f5e6d8;
    --mint: #a8e8d0;
    --yellow: #f9e0a8;
    --red: #f97a8a;
    --text: #3d2c3e;
    --text-light: #7a6080;
    --white: #fff;
    --shadow: 0 4px 20px rgba(200,150,180,0.15);
    --shadow-lg: 0 8px 40px rgba(200,150,180,0.25);
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #fce4f0 0%, #ede4fc 50%, #e4f0fc 100%);
    padding: 20px 16px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(200,150,200,0.12);
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--pink-deep);
    letter-spacing: -0.5px;
  }
  .header p { font-size: 12px; color: var(--text-light); margin-top: 2px; }

  /* NAV TABS */
  .nav {
    display: flex;
    background: var(--white);
    border-bottom: 1px solid var(--cream-dark);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 78px;
    z-index: 99;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    flex: 1;
    min-width: 70px;
    padding: 10px 4px;
    border: none;
    background: none;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: color 0.2s;
    border-bottom: 3px solid transparent;
  }
  .nav-btn .icon { font-size: 18px; }
  .nav-btn.active { color: var(--pink-deep); border-bottom-color: var(--pink-deep); }

  /* CONTENT */
  .content { padding: 16px; padding-bottom: 100px; }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, var(--pink-deep), var(--lilac));
    border: none;
    border-radius: 50%;
    font-size: 28px;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 25px rgba(232,112,154,0.45);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .fab:active { transform: scale(0.93); }

  /* CARDS */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: var(--pink);
  }
  .card.status-confirmed::before { background: var(--lilac); }
  .card.status-baking::before { background: var(--yellow); }
  .card.status-delivered::before { background: var(--mint); }
  .card.status-cancelled::before { background: #ddd; }
  .card.urgent { border: 2px solid var(--red); }


  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
  .customer-name { font-weight: 800; font-size: 16px; color: var(--text); }
  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-confirmed { background: var(--lilac-light); color: #7047b0; }
  .badge-baking { background: #fef8e4; color: #b07a00; }
  .badge-delivered { background: #e4faf2; color: #1a8a60; }
  .badge-cancelled { background: #f0f0f0; color: #888; }

  .card-detail { font-size: 13px; color: var(--text-light); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .card-detail strong { color: var(--text); }
  .card-cake { font-weight: 700; font-size: 15px; color: var(--pink-deep); margin-bottom: 8px; }

  .card-price-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .price-chip {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--cream);
    color: var(--text);
  }
  .price-chip.unpaid { background: #fde4ea; color: var(--red); }

  .card-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .card-actions-right { display: flex; gap: 8px; align-items: center; }
  .btn-sm {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-edit { background: var(--lilac-light); color: #7047b0; }
  .btn-del { background: #fde4ea; color: var(--red); }
  .btn-due { background: #fef8e4; color: #b07a00; }
  .btn-paid { background: #e4faf2; color: #1a8a60; }

  /* DASHBOARD */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 16px 14px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stat-icon { font-size: 24px; margin-bottom: 4px; }
  .stat-val { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--pink-deep); font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--text-light); font-weight: 600; margin-top: 2px; }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--text);
    margin-bottom: 10px;
    margin-top: 6px;
  }

  /* SEARCH */
  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .search-bar input {
    flex: 1;
    padding: 10px 16px;
    border: 2px solid var(--cream-dark);
    border-radius: 25px;
    font-size: 14px;
    font-family: 'Nunito', sans-serif;
    outline: none;
    background: var(--white);
    color: var(--text);
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--pink); }

  .filter-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 12px;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    border: 2px solid var(--cream-dark);
    background: var(--white);
    color: var(--text-light);
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all 0.15s;
  }
  .filter-chip.active { background: var(--pink-deep); border-color: var(--pink-deep); color: white; }

  /* KANBAN */
  .kanban { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .kanban::-webkit-scrollbar { display: none; }
  .kanban-col {
    min-width: 220px;
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 10px;
    flex-shrink: 0;
  }
  .kanban-col-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    text-align: center;
  }
  .col-confirmed .kanban-col-title { background: var(--lilac-light); color: #7047b0; }
  .col-baking .kanban-col-title { background: #fef8e4; color: #b07a00; }
  .col-delivered .kanban-col-title { background: #e4faf2; color: #1a8a60; }
  .col-cancelled .kanban-col-title { background: #f0f0f0; color: #888; }

  .kanban-card {
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 10px rgba(200,150,180,0.1);
    font-size: 13px;
  }
  .kanban-card .cname { font-weight: 800; margin-bottom: 4px; }
  .kanban-card .cdate { font-size: 11px; color: var(--text-light); }
  .kanban-card .ccake { font-size: 12px; color: var(--pink-deep); font-weight: 600; margin-top: 4px; }

  /* CALENDAR */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--pink-deep); padding: 4px 8px; }
  .cal-title { font-family: 'Playfair Display', serif; font-size: 18px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day-label { text-align: center; font-size: 10px; font-weight: 800; color: var(--text-light); padding: 4px 0; }
  .cal-cell {
    min-height: 50px;
    border-radius: 10px;
    padding: 4px;
    background: var(--white);
    position: relative;
    font-size: 11px;
  }
  .cal-cell.empty { background: none; }
  .cal-cell.today { background: linear-gradient(135deg, #fce4f0, #ede4fc); }
  .cal-num { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
  .cal-dot {
    width: 100%;
    border-radius: 6px;
    padding: 1px 4px;
    margin-bottom: 1px;
    font-size: 9px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    background: var(--pink);
    color: white;
  }
  .cal-dot.urgent-dot { background: var(--red); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60,30,60,0.4);
    z-index: 300;
    display: flex;
    align-items: flex-end;
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--white);
    border-radius: 30px 30px 0 0;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px 20px 40px;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--pink-deep); margin-bottom: 20px; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--cream-dark);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--pink); background: var(--white); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-group textarea { resize: none; min-height: 80px; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-label { font-size: 14px; font-weight: 700; }
  .toggle {
    position: relative;
    width: 46px;
    height: 26px;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #ddd;
    border-radius: 13px;
    cursor: pointer;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }
  .toggle input:checked + .toggle-slider { background: var(--pink-deep); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

  .btn-save {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--pink-deep), var(--lilac));
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn-save:active { opacity: 0.85; transform: scale(0.98); }


  /* COLLAPSIBLE SECTIONS */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    padding: 6px 0;
    margin-top: 6px;
  }
  .section-header .section-title { margin: 0; }
  .section-chevron {
    font-size: 16px; color: var(--text-light);
    transition: transform 0.25s;
    font-weight: 700;
  }
  .section-chevron.open { transform: rotate(180deg); }
  .section-body { overflow: hidden; transition: max-height 0.3s ease; }


  /* STATUS DROPDOWN */
  .status-dropdown-wrap { position: relative; display: inline-block; }
  .btn-status { background: var(--cream-dark); color: var(--text); }
  .status-dropdown-wrap .dropdown-menu {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0;
    background: var(--white);
    border-radius: var(--radius-sm);
    box-shadow: 0 8px 30px rgba(100,50,100,0.18);
    z-index: 500;
    min-width: 170px;
    overflow: hidden;
    border: 1px solid var(--cream-dark);
  }
  .status-dropdown-wrap.open .dropdown-menu { display: block; }
  .dropdown-item {
    display: block; width: 100%;
    padding: 10px 14px;
    font-size: 13px; font-weight: 700;
    font-family: 'Nunito', sans-serif;
    border: none; background: none;
    text-align: left; cursor: pointer;
    color: var(--text);
    transition: background 0.15s;
  }
  .dropdown-item:hover { background: var(--cream); }
  .dropdown-item.active { color: var(--pink-deep); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  .alert-banner {
    background: linear-gradient(135deg, #fde4ea, #fef8e4);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    margin-bottom: 12px;
    border-left: 4px solid var(--red);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .alert-banner span { color: var(--red); }

  .photo-preview {
    width: 100%;
    max-height: 150px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🎂 Kamna's Cake Orders</h1>
  <p id="headerSub">Loading...</p>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="showView('dashboard')" id="tab-dashboard">
    <span class="icon">✨</span>Dashboard
  </button>
  <button class="nav-btn" onclick="showView('list')" id="tab-list">
    <span class="icon">📋</span>Orders
  </button>
  <button class="nav-btn" onclick="showView('kanban')" id="tab-kanban">
    <span class="icon">🗂️</span>Board
  </button>
  <button class="nav-btn" onclick="showView('calendar')" id="tab-calendar">
    <span class="icon">📅</span>Calendar
  </button>
</div>

<div class="content" id="content"></div>
<button class="fab" onclick="openModal(null)">＋</button>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">New Order 🎂</div>
    <form id="orderForm" onsubmit="return false;">
      <div class="form-row">
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" id="f-name" placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label>Contact</label>
          <input type="text" id="f-contact" placeholder="Phone / Email">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Order Date</label>
          <input type="date" id="f-orderdate">
        </div>
        <div class="form-group">
          <label>Delivery Date</label>
          <input type="date" id="f-delivdate">
        </div>
      </div>
      <div class="form-group">
        <label>Cake (Design / Flavour / Size)</label>
        <input type="text" id="f-cake" placeholder="e.g. 3-tier vanilla, floral, 10 inch">
      </div>
      <div class="form-group">
        <label>Delivery Address</label>
        <input type="text" id="f-address" placeholder="123 Baker Street…">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Total Price (₹)</label>
          <input type="number" id="f-total" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label>Deposit Paid (₹)</label>
          <input type="number" id="f-deposit" placeholder="0.00" step="0.01" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f-status">
          <option value="confirmed">Confirmed / Deposit Paid</option>
          <option value="baking">In Progress / Baking</option>
          <option value="delivered">Delivered / Complete</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="form-group">
        <label>Special Notes / Dietary</label>
        <textarea id="f-notes" placeholder="Gluten free, nut allergy, extra flowers…"></textarea>
      </div>
      <div class="form-group">
        <label>Reference Images (up to 10)</label>
        <div id="photoDropZone" onclick="document.getElementById('f-photos').click()" style="
          border: 2px dashed var(--pink);
          border-radius: var(--radius-sm);
          padding: 18px;
          text-align: center;
          cursor: pointer;
          background: var(--cream);
          color: var(--text-light);
          font-size: 13px;
          font-weight: 700;
          transition: background 0.2s;
        ">
          📸 Tap to upload images<br>
          <span style="font-size:11px;font-weight:400">Any size · up to 10 photos</span>
        </div>
        <input type="file" id="f-photos" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(this)">
        <div id="photoGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
        <div id="photoCount" style="font-size:11px;color:var(--text-light);margin-top:4px;"></div>
      </div>
      <div class="form-group">
        <div class="toggle-row">
          <span class="toggle-label">🚨 Mark as Urgent</span>
          <label class="toggle">
            <input type="checkbox" id="f-urgent">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      <input type="hidden" id="f-editId">
      <button type="button" class="btn-save" onclick="saveOrder()">Save Order 🎀</button>
    </form>
  </div>
</div>

<script>
// ==================== DATA ====================
let orders = [];
let currentView = 'dashboard';
let searchQ = '';
let filterStatus = 'all';
let calYear, calMonth;
const today = new Date();
calYear = today.getFullYear();
calMonth = today.getMonth();

async function save() {
  try {
    await window.storage.set('cakeOrders', JSON.stringify(orders));
  } catch(e) {
    // fallback to localStorage if storage API unavailable
    try { localStorage.setItem('cakeOrders', JSON.stringify(orders)); } catch(_) {}
  }
}

async function loadOrders() {
  try {
    const result = await window.storage.get('cakeOrders');
    orders = result ? JSON.parse(result.value) : [];
  } catch(e) {
    try { orders = JSON.parse(localStorage.getItem('cakeOrders') || '[]'); } catch(_) { orders = []; }
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function ordersFiltered() {
  return orders.filter(o => {
    const matchSearch = !searchQ ||
      o.name.toLowerCase().includes(searchQ) ||
      o.cake.toLowerCase().includes(searchQ) ||
      (o.contact||'').toLowerCase().includes(searchQ);
    const matchStatus = filterStatus === 'all' || o.status === filterStatus || (filterStatus === 'urgent' && isUrgent(o));
    return matchSearch && matchStatus;
  });
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

function isUrgent(o) {
  if (o.urgent) return true;
  const d = daysUntil(o.delivdate);
  return d !== null && d >= 0 && d <= 2 && o.status !== 'delivered' && o.status !== 'cancelled';
}

// ==================== VIEWS ====================
function showView(v) {
  currentView = v;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + v).classList.add('active');
  render();
}

function render() {
  const el = document.getElementById('content');
  if (currentView === 'dashboard') el.innerHTML = renderDashboard();
  else if (currentView === 'list') el.innerHTML = renderList();
  else if (currentView === 'kanban') el.innerHTML = renderKanban();
  else if (currentView === 'calendar') el.innerHTML = renderCalendar();
  updateHeader();
}

function updateHeader() {
  const active = orders.filter(o => o.status !== 'delivered' && o.status !== 'cancelled');
  document.getElementById('headerSub').textContent = `${active.length} active order${active.length !== 1 ? 's' : ''}`;
}

// DASHBOARD
let dashOpen = { upcoming: false, unpaid: false };

function toggleSection(key) {
  dashOpen[key] = !dashOpen[key];
  render();
}

function renderDashboard() {
  const active = orders.filter(o => o.status !== 'delivered' && o.status !== 'cancelled');
  const revenue = orders.filter(o => o.status === 'delivered').reduce((a, o) => a + (parseFloat(o.total)||0), 0);
  const upcoming = orders.filter(o => { const d = daysUntil(o.delivdate); return d !== null && d >= 0 && d <= 3 && o.status !== 'delivered' && o.status !== 'cancelled'; });
  const urgent = orders.filter(o => isUrgent(o));
  const unpaid = orders.filter(o => {
    const bal = (parseFloat(o.total)||0) - (parseFloat(o.deposit)||0);
    return bal > 0 && o.status !== 'delivered' && o.status !== 'cancelled';
  });

  let html = `<div class="stat-grid">
    <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-val">${active.length}</div><div class="stat-label">Active Orders</div></div>
    <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-val">₹${revenue.toFixed(0)}</div><div class="stat-label">Revenue Earned</div></div>
    <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val">${upcoming.length}</div><div class="stat-label">Due This Week</div></div>
    <div class="stat-card"><div class="stat-icon">⚠️</div><div class="stat-val">${unpaid.length}</div><div class="stat-label">Unpaid Balance</div></div>
  </div>`;

  // URGENT — always visible, no collapse
  if (urgent.length > 0) {
    html += `<div class="section-title">🚨 Urgent Orders</div>`;
    urgent.forEach(o => { html += renderCard(o, true); });
  }

  // UPCOMING — collapsible
  if (upcoming.length > 0) {
    const open = dashOpen.upcoming;
    html += `<div class="section-header" onclick="toggleSection('upcoming')">
      <div class="section-title">⏰ Upcoming Deliveries <span style="font-size:13px;color:var(--text-light);font-family:'Nunito',sans-serif;">(${upcoming.length})</span></div>
      <span class="section-chevron ${open?'open':''}">▾</span>
    </div>
    <div class="section-body" style="max-height:${open ? upcoming.length * 300 + 'px' : '0'};">`;
    upcoming.forEach(o => { html += renderCard(o, true); });
    html += `</div>`;
  }

  // UNPAID — collapsible
  if (unpaid.length > 0) {
    const open = dashOpen.unpaid;
    html += `<div class="section-header" onclick="toggleSection('unpaid')">
      <div class="section-title">💸 Awaiting Payment <span style="font-size:13px;color:var(--text-light);font-family:'Nunito',sans-serif;">(${unpaid.length})</span></div>
      <span class="section-chevron ${open?'open':''}">▾</span>
    </div>
    <div class="section-body" style="max-height:${open ? unpaid.length * 300 + 'px' : '0'};">`;
    unpaid.forEach(o => { html += renderCard(o, true); });
    html += `</div>`;
  }

  if (upcoming.length === 0 && urgent.length === 0 && unpaid.length === 0) {
    html += `<div class="empty-state"><div class="emoji">🍰</div><p>All clear! No urgent items right now.</p></div>`;
  }
  return html;
}

// LIST
function renderList() {
  const filtered = ordersFiltered();
  let html = `
    <div class="search-bar"><input type="text" placeholder="🔍 Search orders…" oninput="searchQ=this.value.toLowerCase();render()" value="${searchQ}"></div>
    <div class="filter-row">
      ${['all','confirmed','baking','delivered','cancelled','urgent'].map(s => `<button class="filter-chip ${filterStatus===s?'active':''}" onclick="filterStatus='${s}';render()">${{all:'All',confirmed:'Confirmed',baking:'Baking',delivered:'Delivered',cancelled:'Cancelled',urgent:'🚨 Urgent'}[s]}</button>`).join('')}
    </div>`;
  if (filtered.length === 0) {
    html += `<div class="empty-state"><div class="emoji">🎂</div><p>No orders found.<br>Tap + to add one!</p></div>`;
  } else {
    filtered.sort((a,b) => new Date(a.delivdate) - new Date(b.delivdate));
    filtered.forEach(o => { html += renderCard(o); });
  }
  return html;
}

// KANBAN
function renderKanban() {
  const statuses = ['confirmed','baking','delivered','cancelled'];
  const labels = { confirmed: 'Confirmed 💜', baking: 'Baking 🔥', delivered: 'Delivered ✅', cancelled: 'Cancelled ❌' };
  let html = `<div class="kanban">`;
  statuses.forEach(s => {
    const cols = orders.filter(o => o.status === s);
    html += `<div class="kanban-col col-${s}">
      <div class="kanban-col-title">${labels[s]}<br><small style="font-size:10px">${cols.length} order${cols.length!==1?'s':''}</small></div>`;
    cols.forEach(o => {
      const d = daysUntil(o.delivdate);
      html += `<div class="kanban-card" onclick="openModal('${o.id}')">
        <div class="cname">${o.name}${isUrgent(o)?' 🚨':''}</div>
        <div class="ccake">${o.cake}</div>
        <div class="cdate">📅 ${formatDate(o.delivdate)}${d !== null && d >= 0 && d <= 3 ? ` <span style="color:var(--red);font-weight:800">(${d===0?'Today!':d+'d'})</span>` : ''}</div>
        ${o.total ? `<div class="cdate" style="margin-top:4px">₹${o.total}</div>` : ''}
      </div>`;
    });
    if (cols.length === 0) html += `<div style="font-size:12px;color:var(--text-light);text-align:center;padding:16px">Empty</div>`;
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

// CALENDAR
function renderCalendar() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const todayStr = today.toISOString().split('T')[0];

  let html = `<div class="cal-header">
    <button class="cal-nav" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}render()">‹</button>
    <div class="cal-title">${monthNames[calMonth]} ${calYear}</div>
    <button class="cal-nav" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}render()">›</button>
  </div>
  <div class="cal-grid">
    ${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-day-label">${d}</div>`).join('')}`;

  for (let i = 0; i < firstDay; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayOrders = orders.filter(o => o.delivdate === dateStr);
    const isToday = dateStr === todayStr;
    html += `<div class="cal-cell ${isToday?'today':''}">
      <div class="cal-num">${d}</div>
      ${dayOrders.slice(0,2).map(o=>`<div class="cal-dot ${isUrgent(o)?'urgent-dot':''}" onclick="openModal('${o.id}')">${o.name.split(' ')[0]}</div>`).join('')}
      ${dayOrders.length > 2 ? `<div style="font-size:9px;color:var(--text-light);font-weight:700">+${dayOrders.length-2} more</div>` : ''}
    </div>`;
  }
  html += `</div>`;

  const monthOrders = orders.filter(o => o.delivdate && o.delivdate.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`));
  if (monthOrders.length > 0) {
    html += `<div class="section-title" style="margin-top:16px">This Month's Orders</div>`;
    monthOrders.sort((a,b) => new Date(a.delivdate)-new Date(b.delivdate)).forEach(o => { html += renderCard(o, true); });
  }
  return html;
}

// CARD
function renderCard(o, compact) {
  const bal = (parseFloat(o.total)||0) - (parseFloat(o.deposit)||0);
  const d = daysUntil(o.delivdate);
  const dueSoon = d !== null && d >= 0 && d <= 3;
  return `<div class="card status-${o.status} ${isUrgent(o)?'urgent':''}">
    <div class="card-top">
      <div class="customer-name">${o.name}</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
        ${isUrgent(o) ? `<span style="background:var(--red);color:white;font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:0.5px;white-space:nowrap;">🚨 URGENT</span>` : ''}
        <span class="status-badge badge-${o.status}">${{confirmed:'Confirmed',baking:'Baking',delivered:'Delivered',cancelled:'Cancelled'}[o.status]}</span>
      </div>
    </div>
    <div class="card-cake">🎂 ${o.cake}</div>
    ${o.delivdate ? `<div class="card-detail">📅 <strong>Delivery:</strong> ${formatDate(o.delivdate)}${dueSoon ? ` <span style="color:var(--red);font-weight:800">${d===0?'— TODAY!':'— in '+d+'d'}</span>`:''}</div>` : ''}
    ${o.address ? `<div class="card-detail">📍 ${o.address}</div>` : ''}
    ${o.contact ? `<div class="card-detail">📞 ${o.contact}</div>` : ''}
    ${o.notes ? `<div class="card-detail">📝 ${o.notes}</div>` : ''}
    ${o.photos && o.photos.length > 0 ? `<div style="display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:4px;scrollbar-width:none;">${o.photos.map((p,i) => `<img src="${p}" onclick="openLightbox('${o.id}',${i})" style="height:72px;width:72px;object-fit:cover;border-radius:10px;flex-shrink:0;cursor:pointer;box-shadow:var(--shadow);">`).join('')}</div>` : ''}
    <div class="card-price-row">
      ${o.total ? `<span class="price-chip">💰 Total: ₹${parseFloat(o.total).toFixed(2)}</span>` : ''}
      ${o.deposit ? `<span class="price-chip">✅ Dep: ₹${parseFloat(o.deposit).toFixed(2)}</span>` : ''}
      ${bal > 0 && o.status !== 'cancelled' ? `<span class="price-chip unpaid">⚠️ Balance: ₹${bal.toFixed(2)}</span>` : ''}
    </div>
    <div class="card-actions">
      <div class="status-dropdown-wrap" id="sdw-${o.id}">
        <button class="btn-sm btn-status" onclick="toggleStatusDropdown('${o.id}', event)">
          ${{confirmed:'💜 Confirmed',baking:'🔥 Baking',delivered:'✅ Delivered',cancelled:'❌ Cancelled'}[o.status]} ▾
        </button>
        <div class="dropdown-menu">
          <button class="dropdown-item ${o.status==='confirmed'?'active':''}" onclick="setStatus('${o.id}','confirmed')">💜 Confirmed</button>
          <button class="dropdown-item ${o.status==='baking'?'active':''}" onclick="setStatus('${o.id}','baking')">🔥 Baking</button>
          <button class="dropdown-item ${o.status==='delivered'?'active':''}" onclick="setStatus('${o.id}','delivered')">✅ Delivered</button>
          <button class="dropdown-item ${o.status==='cancelled'?'active':''}" onclick="setStatus('${o.id}','cancelled')">❌ Cancelled</button>
        </div>
      </div>
      <div class="card-actions-right">
        ${bal > 0 && o.status !== 'cancelled' ? `<button class="btn-sm btn-paid" onclick="markPaid('${o.id}')">✅ Paid</button>` : ''}
        <button class="btn-sm btn-edit" onclick="openModal('${o.id}')">Edit</button>
        <button class="btn-sm btn-del" onclick="deleteOrder('${o.id}')">Delete</button>
      </div>
    </div>
  </div>`;
}

function formatDate(str) {
  if (!str) return '';
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

// ==================== MODAL ====================
function openModal(id) {
  const overlay = document.getElementById('modalOverlay');
  const o = id ? orders.find(x => x.id === id) : null;
  document.getElementById('modalTitle').textContent = o ? 'Edit Order ✏️' : 'New Order 🎂';
  document.getElementById('f-editId').value = o ? o.id : '';
  document.getElementById('f-name').value = o ? o.name : '';
  document.getElementById('f-contact').value = o ? (o.contact||'') : '';
  document.getElementById('f-orderdate').value = o ? (o.orderdate||'') : new Date().toISOString().split('T')[0];
  document.getElementById('f-delivdate').value = o ? (o.delivdate||'') : '';
  document.getElementById('f-cake').value = o ? o.cake : '';
  document.getElementById('f-address').value = o ? (o.address||'') : '';
  document.getElementById('f-total').value = o ? (o.total||'') : '';
  document.getElementById('f-deposit').value = o ? (o.deposit||'') : '';
  document.getElementById('f-status').value = o ? o.status : 'confirmed';
  document.getElementById('f-notes').value = o ? (o.notes||'') : '';
  currentPhotos = o ? (o.photos||[]) : [];
  renderPhotoGrid();
  document.getElementById('f-urgent').checked = o ? !!o.urgent : false;
  overlay.classList.add('open');
}

// Photo upload handling
let currentPhotos = [];

function handlePhotoUpload(input) {
  const files = Array.from(input.files);
  const remaining = 10 - currentPhotos.length;
  if (remaining <= 0) { alert('Max 10 images reached. Remove some first.'); input.value=''; return; }
  const toAdd = files.slice(0, remaining);
  if (files.length > remaining) alert(`Only ${remaining} more image(s) can be added (max 10). Adding first ${remaining}.`);
  let loaded = 0;
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      currentPhotos.push(e.target.result);
      loaded++;
      if (loaded === toAdd.length) renderPhotoGrid();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  const count = document.getElementById('photoCount');
  if (!grid) return;
  grid.innerHTML = currentPhotos.map((p, i) => `
    <div style="position:relative;width:72px;height:72px;">
      <img src="${p}" style="width:72px;height:72px;object-fit:cover;border-radius:10px;box-shadow:var(--shadow);">
      <button onclick="removePhoto(${i})" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--red);color:white;font-size:13px;font-weight:700;cursor:pointer;line-height:1;padding:0;">×</button>
    </div>`).join('');
  count.textContent = currentPhotos.length > 0 ? `${currentPhotos.length}/10 image${currentPhotos.length>1?'s':''} added` : '';
  const zone = document.getElementById('photoDropZone');
  if (zone) zone.style.display = currentPhotos.length >= 10 ? 'none' : 'block';
}

function removePhoto(i) {
  currentPhotos.splice(i, 1);
  renderPhotoGrid();
}

// Lightbox
function openLightbox(orderId, startIdx) {
  const o = orders.find(x => x.id === orderId);
  if (!o || !o.photos || !o.photos.length) return;
  let idx = startIdx;
  const lb = document.createElement('div');
  lb.id = 'lightbox';
  lb.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  function renderLB() {
    lb.innerHTML = `
      <button onclick="document.getElementById('lightbox').remove()" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;color:white;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;">×</button>
      <img src="${o.photos[idx]}" style="max-width:95vw;max-height:80vh;object-fit:contain;border-radius:12px;">
      <div style="color:white;margin-top:12px;font-size:13px;font-family:'Nunito',sans-serif;">${idx+1} / ${o.photos.length}</div>
      ${o.photos.length > 1 ? `
        <div style="display:flex;gap:16px;margin-top:12px;">
          <button onclick="lbPrev()" style="background:rgba(255,255,255,0.15);border:none;color:white;font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer;">‹</button>
          <button onclick="lbNext()" style="background:rgba(255,255,255,0.15);border:none;color:white;font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer;">›</button>
        </div>` : ''}
    `;
  }
  window.lbPrev = () => { idx = (idx - 1 + o.photos.length) % o.photos.length; renderLB(); };
  window.lbNext = () => { idx = (idx + 1) % o.photos.length; renderLB(); };
  renderLB();
  document.body.appendChild(lb);
  lb.addEventListener('click', e => { if (e.target === lb) lb.remove(); });
}

function closeModalOnBg(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

async function saveOrder() {
  const _name = document.getElementById('f-name').value.trim();
  const _cake = document.getElementById('f-cake').value.trim();
  if (!_name) { alert('Please enter a customer name.'); return; }
  if (!_cake) { alert('Please enter cake details.'); return; }
  const id = document.getElementById('f-editId').value;
  const o = {
    id: id || uid(),
    name: document.getElementById('f-name').value.trim(),
    contact: document.getElementById('f-contact').value.trim(),
    orderdate: document.getElementById('f-orderdate').value,
    delivdate: document.getElementById('f-delivdate').value,
    cake: document.getElementById('f-cake').value.trim(),
    address: document.getElementById('f-address').value.trim(),
    total: document.getElementById('f-total').value,
    deposit: document.getElementById('f-deposit').value,
    status: document.getElementById('f-status').value,
    notes: document.getElementById('f-notes').value.trim(),
    photos: [...currentPhotos],
    urgent: document.getElementById('f-urgent').checked,
  };
  if (id) { const i = orders.findIndex(x => x.id === id); orders[i] = o; }
  else orders.unshift(o);
  await save();
  closeModal();
  render();
}

async function markPaid(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  o.deposit = o.total; // set deposit = total so balance = 0
  await save();
  render();
}

function toggleStatusDropdown(id, e) {
  e.stopPropagation();
  const el = document.getElementById('sdw-' + id);
  const isOpen = el.classList.contains('open');
  // close all open dropdowns
  document.querySelectorAll('.status-dropdown-wrap.open').forEach(d => d.classList.remove('open'));
  if (!isOpen) el.classList.add('open');
}

// Close dropdowns when clicking outside
document.addEventListener('click', () => {
  document.querySelectorAll('.status-dropdown-wrap.open').forEach(d => d.classList.remove('open'));
});

async function setStatus(id, status) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  o.status = status;
  await save();
  render();
}

async function deleteOrder(id) {
  if (!confirm('Delete this order?')) return;
  orders = orders.filter(o => o.id !== id);
  await save();
  render();
}

// ==================== INIT ====================
(async () => { await loadOrders(); render(); })();
</script>
